[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlrunner"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pathspec>=1.1.1",
    "sqlglot>=30.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sqlrunner = "sqlrunner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlrunner"]
